name: notification

on:
  workflow_call:
    secrets:
      webhook:
        description: "Loop webhook URL"
        required: true
      notificationChannel:
        description: "Loop notification channel"
        required: true
      loopNotificationGroup:
        description: "Loop notification group"
        required: false

defaults:
  run:
    shell: bash

permissions:
  actions: read

jobs:
  notify:
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    steps:
      - name: Detect workflow conclusion
        id: workflow_conclusion
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          jobs_json=$(curl --silent --show-error \
            --header "Authorization: Bearer $GH_TOKEN" \
            --header "Accept: application/vnd.github+json" \
            "${{ github.api_url }}/repos/${{ github.repository }}/actions/runs/${{ github.run_id }}/jobs?per_page=100")

          conclusion=$(jq -r '
            [.jobs[] | select(.name != $job_name and .status == "completed") | .conclusion] as $conclusions
            | if any($conclusions[]?; . == "failure") then "failure"
              elif any($conclusions[]?; . == "cancelled") then "cancelled"
              elif any($conclusions[]?; . == "timed_out") then "timed_out"
              elif any($conclusions[]?; . == "action_required") then "action_required"
              elif any($conclusions[]?; . == "startup_failure") then "failure"
              elif all($conclusions[]?; . == "success" or . == "skipped" or . == "neutral") then "success"
              else "failure"
              end
          ' --arg job_name '${{ github.job }}' <<< "$jobs_json")

          failed_jobs=$(jq -r '.jobs[] | select(.conclusion == "failure") | .html_url' <<< "$jobs_json")

          echo "conclusion=$conclusion" >> "$GITHUB_OUTPUT"
          echo 'failed<<EOF' >> "$GITHUB_OUTPUT"
          echo "$failed_jobs" >> "$GITHUB_OUTPUT"
          echo 'EOF' >> "$GITHUB_OUTPUT"

      - if: steps.workflow_conclusion.outputs.conclusion == 'failure'
        name: get failed jobs
        id: failed_jobs
        run: |
          echo 'failed<<EOF' >> $GITHUB_OUTPUT
          echo "${{ steps.workflow_conclusion.outputs.failed }}" >> $GITHUB_OUTPUT
          echo 'EOF' >> $GITHUB_OUTPUT

      - if: steps.workflow_conclusion.outputs.conclusion == 'failure' && (startsWith(github.ref, 'refs/pull/') || github.event_name == 'workflow_dispatch')
        name: get user
        id: get_user
        run: |
          echo username=$(curl ${{ github.api_url }}/users/${{ github.triggering_actor }} | jq -r '.name' | tr '[:upper:]' '[:lower:]' | tr " " . ) >> $GITHUB_OUTPUT

      - if: steps.workflow_conclusion.outputs.conclusion == 'failure' && !startsWith(github.ref, 'refs/pull/') && github.event_name != 'workflow_dispatch'
        name: Failure notify
        uses: mattermost/action-mattermost-notify@master
        with:
          MATTERMOST_WEBHOOK_URL: ${{ secrets.webhook }}
          MATTERMOST_CHANNEL: ${{ secrets.notificationChannel }}
          TEXT: |
            ${{ secrets.loopNotificationGroup }} Прод упал :pepe_monkaw: 
            Репозиторий: ${{ github.repository }}
            [${{ github.workflow }}](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}) ${{ github.ref_name }} :pepe_deadge: 
            Упавшие джобы:
            ${{ steps.failed_jobs.outputs.failed }}

      - if: steps.workflow_conclusion.outputs.conclusion == 'failure' && (startsWith(github.ref, 'refs/pull/') || github.event_name == 'workflow_dispatch')
        name: Failure notify for PRs
        uses: mattermost/action-mattermost-notify@master
        with:
          MATTERMOST_WEBHOOK_URL: ${{ secrets.webhook }}
          MATTERMOST_CHANNEL: ${{ secrets.notificationChannel }}
          TEXT: |
            @${{ steps.get_user.outputs.username }} Проблема в ветке :press_f:
            Репозиторий: ${{ github.repository }}
            [${{ github.workflow }}](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}) ${{ github.ref_name }} :pepe_deadge: 
            Упавшие джобы:
            ${{ steps.failed_jobs.outputs.failed }}